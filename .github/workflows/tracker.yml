name: HolidayCheck Tracker

on:
  workflow_dispatch:
  schedule:
    # Zeiten in UTC (Winterzeit in DE = UTC+1)
    - cron: '3 5 * * *'    # 06:03 Uhr DE
    - cron: '45 8 * * *'   # 09:45 Uhr DE
    - cron: '30 12 * * *'  # 13:30 Uhr DE
    - cron: '15 16 * * *'  # 17:15 Uhr DE
    - cron: '3 20 * * *'   # 21:03 Uhr DE

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright openpyxl
          playwright install --with-deps chromium

      - name: Start WireGuard VPN (Isolierter Namespace)
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools

          CLEAN_CFG=$(printf '%s\n' "$WIREGUARD_CONFIG" | tr -d '\r')
          WG_ADDR=$(printf '%s\n' "$CLEAN_CFG" | grep -i '^[[:space:]]*Address[[:space:]]*=' | head -n1 | cut -d'=' -f2- | tr ',' '\n' | grep -v ':' | head -n1 | tr -d ' ' || true)
          WG_DNS=$(printf '%s\n' "$CLEAN_CFG" | grep -i '^[[:space:]]*DNS[[:space:]]*=' | head -n1 | cut -d'=' -f2- | tr ',' '\n' | grep -E '^[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' | head -n1 | tr -d ' ' || true)

          if [ -z "$WG_ADDR" ]; then
            echo "FEHLER: Keine IPv4-Adresse in WIREGUARD_CONFIG gefunden."
            exit 1
          fi

          # Reine WireGuard-Config ohne wg-quick-Zusatzfelder erzeugen
          sudo mkdir -p /etc/wireguard /etc/netns/vpn
          printf '%s\n' "$CLEAN_CFG" \
            | grep -viE '^[[:space:]]*(Address|DNS|MTU|Table|PreUp|PostUp|PreDown|PostDown|SaveConfig)[[:space:]]*=' \
            | sed -E 's/,?[[:space:]]*::\/0//g; s/=[[:space:]]*,/= /; s/,[[:space:]]*$//' \
            | sudo tee /etc/wireguard/wg0-raw.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0-raw.conf

          # DNS nur für den isolierten Namespace 'vpn' setzen
          if [ -n "$WG_DNS" ]; then
            printf "nameserver %s\nnameserver 1.1.1.1\noptions timeout:2 attempts:2\n" "$WG_DNS" | sudo tee /etc/netns/vpn/resolv.conf > /dev/null
          else
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:2\n" | sudo tee /etc/netns/vpn/resolv.conf > /dev/null
          fi

          echo "Host-IP (GitHub Runner): $(curl -4 -s --max-time 10 https://api.ipify.org || echo unbekannt)"

          # wg0 auf dem Host anlegen (UDP-Tunnel nutzt AWS-Netz) und in Namespace 'vpn' verschieben
          sudo ip link add wg0 type wireguard
          sudo wg setconf wg0 /etc/wireguard/wg0-raw.conf
          sudo ip netns add vpn
          sudo ip link set wg0 netns vpn
          sudo ip -n vpn link set lo up
          sudo ip -n vpn addr add "$WG_ADDR" dev wg0
          sudo ip -n vpn link set wg0 mtu 1280 up
          sudo ip -n vpn route add default dev wg0

          sleep 2
          TRACE=$(sudo ip netns exec vpn curl -4 -fsS --max-time 15 https://1.1.1.1/cdn-cgi/trace 2>&1 || true)
          VPN_IP=$(printf '%s\n' "$TRACE" | awk -F= '/^ip=/{print $2}' | tr -d '\r\n')
          VPN_LOC=$(printf '%s\n' "$TRACE" | awk -F= '/^loc=/{print $2}' | tr -d '\r\n')

          # DNS im VPN-Namespace testen; bei Bedarf auf 1.1.1.1 umschalten
          if [ -n "$VPN_IP" ] && ! sudo ip netns exec vpn curl -4 -fsS --max-time 10 https://icanhazip.com > /dev/null 2>&1; then
            echo "DNS über ${WG_DNS:-Standard} klemmt, wechsle im VPN-Namespace auf 1.1.1.1 / 8.8.8.8 ..."
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:2\n" | sudo tee /etc/netns/vpn/resolv.conf > /dev/null
          fi

          if [ -z "$VPN_IP" ]; then
            echo "FEHLER: Keine Verbindung im VPN-Namespace. Diagnose:"
            echo "$TRACE"
            sudo ip netns exec vpn wg show || true
            exit 1
          fi
          echo "IP im VPN-Namespace: $VPN_IP (Land: ${VPN_LOC:-unbekannt})"

      - name: Run Tracker
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          BROWSER_CHANNEL: chromium
        run: |
          sudo ip netns exec vpn sudo -u "$USER" env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "SHEET_ID=$SHEET_ID" \
            "WEBHOOK_URL=$WEBHOOK_URL" \
            "WEBHOOK_TOKEN=$WEBHOOK_TOKEN" \
            "BROWSER_CHANNEL=$BROWSER_CHANNEL" \
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python -u tracker.py --show

      - name: Stop WireGuard VPN
        if: always()
        run: |
          sudo ip netns del vpn 2>/dev/null || true
          sudo ip link del wg0 2>/dev/null || true
          sudo rm -rf /etc/netns/vpn /etc/wireguard/wg0-raw.conf
