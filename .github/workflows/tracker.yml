name: HolidayCheck Tracker

on:
  workflow_dispatch: # Erlaubt dir weiterhin den manuellen Start per Button
  schedule:
    # Zeiten in UTC (Aktuell Winterzeit in DE: UTC+1)
    # 06:00 Uhr deutsche Zeit (05:00 UTC)
    - cron: '0 5 * * *'
    # 09:45 Uhr deutsche Zeit (08:45 UTC)
    - cron: '45 8 * * *'
    # 13:30 Uhr deutsche Zeit (12:30 UTC)
    - cron: '30 12 * * *'
    # 17:15 Uhr deutsche Zeit (16:15 UTC)
    - cron: '15 16 * * *'
    # 21:00 Uhr deutsche Zeit (20:00 UTC)
    - cron: '0 20 * * *'

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Großzügiges Limit für über 200 Hotels
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright openpyxl
          playwright install --with-deps chromium

      - name: Run Tracker
        env:
          # Hier holt sich GitHub deine geheimen Daten aus dem Tresor
          SHEET_ID: ${{ secrets.SHEET_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tracker.py --show
