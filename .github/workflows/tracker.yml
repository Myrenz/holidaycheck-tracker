name: HolidayCheck Tracker

on:
  workflow_dispatch: # Erlaubt weiterhin den manuellen Start per Button
  schedule:
    # Zeiten in UTC (Winterzeit in DE = UTC+1)
    # Leicht ungerade Minuten verhindern, dass GitHub Läufe zur vollen Stunde überspringt
    - cron: '3 5 * * *'    # 06:03 Uhr deutsche Zeit
    - cron: '45 8 * * *'   # 09:45 Uhr deutsche Zeit
    - cron: '30 12 * * *'  # 13:30 Uhr deutsche Zeit
    - cron: '15 16 * * *'  # 17:15 Uhr deutsche Zeit
    - cron: '3 20 * * *'   # 21:03 Uhr deutsche Zeit

jobs:
  track:
    runs-on: ubuntu-24.04  # Fest auf 24.04 gepinnt (verhindert DNS- & Sandbox-Crashes von Ubuntu 26.04)
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright openpyxl
          playwright install --with-deps chromium

      - name: Run Tracker
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          BROWSER_CHANNEL: chromium
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tracker.py --show
