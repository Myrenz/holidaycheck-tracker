name: HolidayCheck Tracker

on:
  workflow_dispatch:
  schedule:
    # Zeiten in UTC (Winterzeit in DE = UTC+1)
    - cron: '3 5 * * *'    # 06:03 Uhr DE
    - cron: '45 8 * * *'   # 09:45 Uhr DE
    - cron: '30 12 * * *'  # 13:30 Uhr DE
    - cron: '15 16 * * *'  # 17:15 Uhr DE
    - cron: '3 20 * * *'   # 21:03 Uhr DE

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright openpyxl
          playwright install --with-deps chromium

      - name: Start WireGuard VPN
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          # Hostname lokal eintragen, damit sudo ohne DNS-Verzögerung läuft
          echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts > /dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools

          WG_DNS=$(printf '%s\n' "$WIREGUARD_CONFIG" | tr -d '\r' | grep -i '^[[:space:]]*DNS[[:space:]]*=' | head -n1 | cut -d'=' -f2 | cut -d',' -f1 | tr -d ' ' || true)

          printf '%s\n' "$WIREGUARD_CONFIG" \
            | tr -d '\r' \
            | grep -viE '^[[:space:]]*(DNS|MTU)[[:space:]]*=' \
            | sed -E 's/,?[[:space:]]*::\/0//g; s/=[[:space:]]*,/= /; s/,[[:space:]]*$//' \
            | sed -E '/^[[:space:]]*\[Interface\]/a MTU = 1280' \
            | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

          echo "IP vor VPN: $(curl -4 -s --max-time 10 https://api.ipify.org || echo unbekannt)"
          sudo wg-quick up wg0

          sudo rm -f /etc/resolv.conf
          if [ -n "$WG_DNS" ]; then
            printf "nameserver %s\nnameserver 1.1.1.1\noptions timeout:2 attempts:2\n" "$WG_DNS" | sudo tee /etc/resolv.conf > /dev/null
          else
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:2\n" | sudo tee /etc/resolv.conf > /dev/null
          fi

          sleep 2
          # IP direkt über Cloudflare-Trace prüfen (ohne DNS-Abhängigkeit, blockt keine VPNs)
          TRACE=$(curl -4 -fsS --max-time 15 https://1.1.1.1/cdn-cgi/trace 2>&1 || true)
          VPN_IP=$(printf '%s\n' "$TRACE" | awk -F= '/^ip=/{print $2}' | tr -d '\r\n')
          VPN_LOC=$(printf '%s\n' "$TRACE" | awk -F= '/^loc=/{print $2}' | tr -d '\r\n')

          # Fallback über DNS-basierte Prüfung
          if [ -z "$VPN_IP" ]; then
            VPN_IP=$(curl -4 -fsS --max-time 15 https://icanhazip.com 2>/dev/null | tr -d '\r\n' || true)
          fi

          # DNS testen und bei Hänger automatisch auf 1.1.1.1 umschalten
          if [ -n "$VPN_IP" ] && ! curl -4 -fsS --max-time 10 https://icanhazip.com > /dev/null 2>&1; then
            echo "DNS über ${WG_DNS:-Standard} klemmt, wechsle auf 1.1.1.1 / 8.8.8.8 ..."
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:2\n" | sudo tee /etc/resolv.conf > /dev/null
          fi

          if [ -z "$VPN_IP" ]; then
            echo "FEHLER: Keine Verbindung über WireGuard. Diagnose:"
            echo "--- Cloudflare Trace / Fehler ---"
            echo "$TRACE"
            echo "--- HTTP-Test (Klartext) ---"
            curl -4 -v --max-time 10 http://checkip.amazonaws.com || true
            echo "--- /etc/resolv.conf ---"
            cat /etc/resolv.conf || true
            echo "--- Routing ---"
            ip -4 route show || true
            echo "--- WireGuard ---"
            sudo wg show || true
            sudo wg-quick down wg0 || true
            exit 1
          fi
          echo "IP über VPN: $VPN_IP (Land: ${VPN_LOC:-unbekannt})"

      - name: Run Tracker
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          BROWSER_CHANNEL: chromium
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tracker.py --show

      - name: Stop WireGuard VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true
