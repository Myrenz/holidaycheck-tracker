name: HolidayCheck Tracker

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Anzahl Hotels zum Testen (0 = alle)'
        required: false
        default: '0'
  schedule:
    # Zeiten in UTC (Winterzeit in DE = UTC+1)
    - cron: '3 5 * * *'    # 06:03 Uhr DE
    - cron: '45 8 * * *'   # 09:45 Uhr DE
    - cron: '30 12 * * *'  # 13:30 Uhr DE
    - cron: '15 16 * * *'  # 17:15 Uhr DE
    - cron: '3 20 * * *'   # 21:03 Uhr DE

concurrency:
  group: holidaycheck-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests patchright openpyxl
          patchright install --with-deps chrome || patchright install --with-deps chromium

      - name: Start WireGuard VPN (Fritz!Box Namespace)
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts > /dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iproute2

          echo "IP vor VPN: $(curl -4 -s --max-time 10 https://api.ipify.org || echo unbekannt)"

          # Config für isolierten VPN-Namespace aufbereiten (nur IPv4, Endpoint direkt als IPv4 auflösen)
          python3 - <<'PY'
          import os, re, socket

          cfg = os.environ["WIREGUARD_CONFIG"].replace("\r", "")
          addr_v4 = ""
          dns_v4 = ""
          out_lines = []

          for line in cfg.splitlines():
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              low = s.lower()
              if low.startswith("address"):
                  val = s.split("=", 1)[1]
                  for part in val.split(","):
                      part = part.strip()
                      if not addr_v4 and re.match(r"^\d+\.\d+\.\d+\.\d+(/\d+)?$", part):
                          addr_v4 = part
                  continue
              if low.startswith("dns"):
                  val = s.split("=", 1)[1]
                  for part in val.split(","):
                      part = part.strip()
                      if not dns_v4 and re.match(r"^\d+\.\d+\.\d+\.\d+$", part):
                          dns_v4 = part
                  continue
              if low.startswith("mtu"):
                  continue
              if low.startswith("allowedips"):
                  out_lines.append("AllowedIPs = 0.0.0.0/0")
                  continue
              if low.startswith("endpoint"):
                  val = s.split("=", 1)[1].strip()
                  host, port = val.rsplit(":", 1)
                  ip = socket.gethostbyname(host.strip("[]"))
                  print(f"FRITZ!Box Endpoint aufgeloest: {host} -> {ip}:{port}")
                  out_lines.append(f"Endpoint = {ip}:{port}")
                  continue
              out_lines.append(s)

          if not addr_v4:
              raise SystemExit("FEHLER: Keine IPv4-Adresse in WIREGUARD_CONFIG gefunden.")

          with open("/tmp/wg0_pure.conf", "w") as f:
              f.write("\n".join(out_lines) + "\n")
          with open("/tmp/wg0_meta.env", "w") as f:
              f.write(f"WG_ADDR={addr_v4}\n")
              f.write(f"WG_DNS={dns_v4 or '192.168.178.1'}\n")
          PY

          source /tmp/wg0_meta.env
          chmod 600 /tmp/wg0_pure.conf

          sudo ip netns del vpn 2>/dev/null || true
          sudo ip link del wg0 2>/dev/null || true
          sudo ip netns add vpn
          sudo ip link add wg0 type wireguard
          sudo wg setconf wg0 /tmp/wg0_pure.conf
          rm -f /tmp/wg0_pure.conf /tmp/wg0_meta.env

          sudo ip link set wg0 netns vpn
          sudo ip -n vpn link set lo up
          sudo ip -n
